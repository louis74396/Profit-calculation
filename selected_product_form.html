<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选品确认表单</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #f59e0b;
      --accent-dark: #d97706;
      --success-bg: #ecfdf5;
      --success-text: #047857;
      --info-bg: #eff6ff;
      --info-border: #bfdbfe;
      --info-text: #1d4ed8;
      --warning-bg: #fff7ed;
      --warning-border: #fdba74;
      --warning-text: #c2410c;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: min(1180px, calc(100% - 24px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .hero,
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 24px;
      margin-bottom: 18px;
    }

    .tag {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--success-bg);
      color: var(--success-text);
      font-size: 12px;
      font-weight: 700;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: 32px;
      line-height: 1.2;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn,
    .link-btn,
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 42px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover,
    .link-btn:hover,
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
    }

    .primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .primary:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    .panel {
      padding: 20px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .panel h2 {
      margin: 0;
      font-size: 20px;
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .required {
      color: #dc2626;
      font-weight: 700;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #fbbf24;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
    }

    .field input[readonly] {
      background: #f9fafb;
    }

    .field input.is-invalid,
    .field textarea.is-invalid {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
    }

    .field-help,
    .error-text {
      font-size: 12px;
      line-height: 1.6;
    }

    .field-help {
      color: var(--muted);
    }

    .error-text {
      color: #dc2626;
      min-height: 19px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .summary-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 14px;
      background: #fcfcfd;
    }

    .summary-card span {
      display: block;
    }

    .summary-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .summary-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      word-break: break-word;
    }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      color: var(--info-text);
      font-size: 13px;
      line-height: 1.7;
    }

    .status.warning {
      background: var(--warning-bg);
      border-color: var(--warning-border);
      color: var(--warning-text);
    }

    .status.success {
      background: var(--success-bg);
      border-color: #a7f3d0;
      color: var(--success-text);
    }

    @media (max-width: 980px) {
      .grid,
      .summary {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <div class="tag">选品确认页</div>
      <h1>选品表单</h1>
      <p class="sub">用于确认单条选品信息。保存后会自动写入“选品记录页”，方便后续沉淀和上传管理。</p>
      <div class="actions">
        <a class="link-btn" href="./pricing_profit_calculator.html">返回利润测算页</a>
        <a class="link-btn" href="./selected_product_records.html">切换到选品记录页</a>
        <button class="primary" id="saveRecordBtn" type="button">保存到记录页</button>
        <button id="clearDraftBtn" type="button">清空当前草稿</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>当前选品信息</h2>
        <div class="hint">建议先确认日期、竞品链接、图片链接，再保存。</div>
      </div>

      <div class="summary" aria-label="关键信息概览">
        <div class="summary-card">
          <span class="summary-label">产品类目</span>
          <span class="summary-value" id="summaryCategory">-</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">前台定价(CNY)</span>
          <span class="summary-value" id="summaryPrice">-</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">利润率(不含税)</span>
          <span class="summary-value" id="summaryProfitRate">-</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">利润率(扣税后)</span>
          <span class="summary-value" id="summaryProfitRateAfterTax">-</span>
        </div>
      </div>

      <div class="grid">
        <div class="field">
          <label for="selectedDate">选品日期 <span class="required">*</span></label>
          <input id="selectedDate" type="date" />
          <div class="error-text" id="selectedDateError"></div>
        </div>

        <div class="field">
          <label for="category">产品类目</label>
          <input id="category" type="text" readonly />
          <div class="field-help">自动从利润测算页带入。</div>
        </div>

        <div class="field full">
          <label for="competitorLink">竞品链接 <span class="required">*</span></label>
          <input id="competitorLink" type="url" placeholder="请输入竞品链接" />
          <div class="error-text" id="competitorLinkError"></div>
        </div>

        <div class="field full">
          <label for="imageLink">图片链接 <span class="required">*</span></label>
          <input id="imageLink" type="url" placeholder="请输入图片链接，或粘贴图片地址" />
          <div class="error-text" id="imageLinkError"></div>
        </div>

        <div class="field">
          <label for="weight">重量</label>
          <input id="weight" type="text" placeholder="如：0.35kg" />
          <div class="field-help">建议填写单件毛重或核算用重量。</div>
        </div>

        <div class="field">
          <label for="volume">体积</label>
          <input id="volume" type="text" placeholder="如：0.002m³" />
          <div class="field-help">可填写包装体积或材积。</div>
        </div>

        <div class="field full">
          <label for="dimensions">长宽高</label>
          <input id="dimensions" type="text" placeholder="如：20 × 15 × 8 cm" />
          <div class="field-help">建议统一填写格式：长 × 宽 × 高。</div>
        </div>

        <div class="field full">
          <label for="notes">备注</label>
          <textarea id="notes" placeholder="可填写选品判断、补充说明、风险点"></textarea>
          <div class="field-help">建议记录选品原因、价格带判断、潜在风险。</div>
        </div>

        <div class="field"><label for="priceCny">前台定价(CNY)</label><input id="priceCny" type="text" readonly /></div>
        <div class="field"><label for="priceNgn">前台定价(NGN)</label><input id="priceNgn" type="text" readonly /></div>
        <div class="field"><label for="priceUsd">前台定价(USD)</label><input id="priceUsd" type="text" readonly /></div>
        <div class="field"><label for="profitNoTax">利润(CNY，不含税)</label><input id="profitNoTax" type="text" readonly /></div>
        <div class="field"><label for="profitRateNoTax">利润率(不含税)</label><input id="profitRateNoTax" type="text" readonly /></div>
        <div class="field"><label for="profitAfterTax">利润(CNY，扣税后)</label><input id="profitAfterTax" type="text" readonly /></div>
        <div class="field"><label for="profitRateAfterTax">利润率(扣税后)</label><input id="profitRateAfterTax" type="text" readonly /></div>
        <div class="field"><label for="commissionRate">佣金率</label><input id="commissionRate" type="text" readonly /></div>
        <div class="field"><label for="fulfillmentCny">妥投出库费(CNY)</label><input id="fulfillmentCny" type="text" readonly /></div>
        <div class="field"><label for="warehouseCny">仓储费(CNY)</label><input id="warehouseCny" type="text" readonly /></div>
        <div class="field"><label for="airFreightCny">运费(CNY)</label><input id="airFreightCny" type="text" readonly /></div>
      </div>

      <div class="status" id="statusText">等待从利润测算页带入数据。</div>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const DRAFT_KEY = 'jumia_selected_product_draft';
    const LIST_KEY = 'jumia_selected_product_records';
    const REQUIRED_FIELDS = ['selectedDate', 'competitorLink', 'imageLink'];

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function setStatus(message, type = 'info') {
      const el = $('statusText');
      el.textContent = message;
      el.className = `status${type === 'info' ? '' : ` ${type}`}`;
    }

    function safeParse(raw, fallback) {
      try {
        return raw ? JSON.parse(raw) : fallback;
      } catch (error) {
        console.error('JSON parse failed:', error);
        return fallback;
      }
    }

    function setValue(id, value = '') {
      $(id).value = value ?? '';
    }

    function syncSummary() {
      $('summaryCategory').textContent = $('category').value || '-';
      $('summaryPrice').textContent = $('priceCny').value || '-';
      $('summaryProfitRate').textContent = $('profitRateNoTax').value || '-';
      $('summaryProfitRateAfterTax').textContent = $('profitRateAfterTax').value || '-';
    }

    function clearErrors() {
      REQUIRED_FIELDS.forEach((id) => {
        $(id).classList.remove('is-invalid');
        const errorEl = $(`${id}Error`);
        if (errorEl) errorEl.textContent = '';
      });
    }

    function isValidUrl(value) {
      try {
        const url = new URL(value);
        return ['http:', 'https:'].includes(url.protocol);
      } catch {
        return false;
      }
    }

    function validateForm() {
      clearErrors();
      const errors = [];

      if (!$('selectedDate').value) {
        $('selectedDate').classList.add('is-invalid');
        $('selectedDateError').textContent = '请选择选品日期。';
        errors.push('选品日期未填写');
      }

      const competitorLink = $('competitorLink').value.trim();
      if (!competitorLink) {
        $('competitorLink').classList.add('is-invalid');
        $('competitorLinkError').textContent = '请输入竞品链接。';
        errors.push('竞品链接未填写');
      } else if (!isValidUrl(competitorLink)) {
        $('competitorLink').classList.add('is-invalid');
        $('competitorLinkError').textContent = '请输入有效的 http 或 https 链接。';
        errors.push('竞品链接格式无效');
      }

      const imageLink = $('imageLink').value.trim();
      if (!imageLink) {
        $('imageLink').classList.add('is-invalid');
        $('imageLinkError').textContent = '请输入图片链接。';
        errors.push('图片链接未填写');
      } else if (!isValidUrl(imageLink)) {
        $('imageLink').classList.add('is-invalid');
        $('imageLinkError').textContent = '请输入有效的 http 或 https 链接。';
        errors.push('图片链接格式无效');
      }

      return {
        valid: errors.length === 0,
        errors,
      };
    }

    function loadDraft() {
      $('selectedDate').value = today();
      const data = safeParse(localStorage.getItem(DRAFT_KEY), null);

      if (!data) {
        syncSummary();
        setStatus('当前没有从利润测算页传入的新数据。你仍然可以手动补充信息后保存。', 'warning');
        return;
      }

      setValue('category', data.category);
      setValue('priceCny', data.priceCny);
      setValue('priceNgn', data.priceNgn);
      setValue('priceUsd', data.priceUsd);
      setValue('profitNoTax', data.profitNoTax);
      setValue('profitRateNoTax', data.profitRateNoTax);
      setValue('profitAfterTax', data.profitAfterTax);
      setValue('profitRateAfterTax', data.profitRateAfterTax);
      setValue('commissionRate', data.commissionRate);
      setValue('fulfillmentCny', data.fulfillmentCny);
      setValue('warehouseCny', data.warehouseCny);
      setValue('airFreightCny', data.airFreightCny);
      setValue('competitorLink', data.competitorLink);
      setValue('imageLink', data.imageLink);
      setValue('weight', data.weight);
      setValue('volume', data.volume);
      setValue('dimensions', data.dimensions);
      setValue('notes', data.notes);

      if (data.selectedDate) {
        setValue('selectedDate', data.selectedDate);
      }

      syncSummary();
      setStatus('已读取利润测算页传来的最新选品数据，请补充并校验必填项后保存。');
    }

    function buildRecord() {
      const draft = safeParse(localStorage.getItem(DRAFT_KEY), {});
      return {
        ...draft,
        selectedDate: $('selectedDate').value,
        category: $('category').value.trim(),
        competitorLink: $('competitorLink').value.trim(),
        imageLink: $('imageLink').value.trim(),
        weight: $('weight').value.trim(),
        volume: $('volume').value.trim(),
        dimensions: $('dimensions').value.trim(),
        notes: $('notes').value.trim(),
        priceCny: $('priceCny').value.trim(),
        priceNgn: $('priceNgn').value.trim(),
        priceUsd: $('priceUsd').value.trim(),
        profitNoTax: $('profitNoTax').value.trim(),
        profitRateNoTax: $('profitRateNoTax').value.trim(),
        profitAfterTax: $('profitAfterTax').value.trim(),
        profitRateAfterTax: $('profitRateAfterTax').value.trim(),
        commissionRate: $('commissionRate').value.trim(),
        fulfillmentCny: $('fulfillmentCny').value.trim(),
        warehouseCny: $('warehouseCny').value.trim(),
        airFreightCny: $('airFreightCny').value.trim(),
        savedAt: new Date().toISOString(),
      };
    }

    function saveRecord() {
      const validation = validateForm();
      if (!validation.valid) {
        setStatus(`保存失败，请先处理以下问题：${validation.errors.join('；')}。`, 'warning');
        return;
      }

      const record = buildRecord();
      const list = safeParse(localStorage.getItem(LIST_KEY), []);
      list.unshift(record);
      localStorage.setItem(LIST_KEY, JSON.stringify(list));
      localStorage.setItem(DRAFT_KEY, JSON.stringify(record));

      setStatus('已保存到选品记录页，正在跳转。', 'success');
      window.location.href = './selected_product_records.html';
    }

    function clearDraft() {
      localStorage.removeItem(DRAFT_KEY);
      $('selectedDate').value = today();
      ['category', 'competitorLink', 'imageLink', 'weight', 'volume', 'dimensions', 'notes', 'priceCny', 'priceNgn', 'priceUsd', 'profitNoTax', 'profitRateNoTax', 'profitAfterTax', 'profitRateAfterTax', 'commissionRate', 'fulfillmentCny', 'warehouseCny', 'airFreightCny'].forEach((id) => setValue(id, ''));
      clearErrors();
      syncSummary();
      setStatus('当前草稿已清空。', 'warning');
    }

    $('saveRecordBtn').addEventListener('click', saveRecord);
    $('clearDraftBtn').addEventListener('click', clearDraft);
    $('competitorLink').addEventListener('blur', validateForm);
    $('imageLink').addEventListener('blur', validateForm);
    $('selectedDate').addEventListener('change', validateForm);

    loadDraft();
  </script>
</body>
</html>
